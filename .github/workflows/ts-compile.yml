name: TypeScript compile check

on:
  push:
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Bumped to 20 to clear deprecation warnings

      - name: Cache npm (npm cache)
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies and TypeScript
        run: |
          if [ -f package.json ]; then
            npm ci
            # Explicitly install typescript to prevent npx from grabbing the deprecated 'tsc' package
            npm install typescript --no-save 
          else
            npm install -g typescript
          fi

      - name: Run TypeScript compiler (no emit)
        run: |
          # Now it will safely use the correct TypeScript compiler
          npx tsc --noEmit
